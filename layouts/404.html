			<div class="error-404 not-found">
				<div class="page-content">
					<header class="page-header">

					</header><!-- .page-header -->

				</div><!-- .page-content -->
			</div><!-- .error-404 -->
		</main><!-- #main -->
	</div><!-- #primary -->
{{ end }}
